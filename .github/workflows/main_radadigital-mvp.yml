name: Deploy to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'radadigital-mvp'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_XXXX }}
          # AQUÍ ESTÁ EL CAMBIO: le decimos que suba la carpeta server
          package: './server'
          # Configuramos la versión de Node directamente en el despliegue
          app-settings-json: '[{"name": "WEBSITE_NODE_DEFAULT_VERSION", "value": "22.0.0"}]'
